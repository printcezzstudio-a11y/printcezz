<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Printcezz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pink-50:#fff6fa;--pink-100:#ffe7f1;--pink-200:#ffd0e6;--pink-300:#ffb0d3;
  --pink-400:#ff8cc0;--pink-500:#f767a3;--pink-600:#e04d89;--ink:#5a3b49;
  --ink-soft:#8a6b78;--white:#fffdfe;--line:#ffd9ea;--gold:#f2b25c;
  --ok:#7fbf7f;--warn:#e08b4c;--bad:#e06a6a;
  font-family:'Mali','Segoe UI',system-ui,-apple-system,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:linear-gradient(180deg,var(--pink-50),#fff);color:var(--ink);min-height:100%}
h1,h2,h3,h4{margin:.2em 0;color:var(--pink-600)}
header.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.9);backdrop-filter:blur(6px);
  padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.3rem;color:var(--pink-600)}
.brand span.dot{color:var(--gold)}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap}
nav.tabs button{border:none;background:var(--pink-100);color:var(--pink-600);padding:8px 14px;border-radius:999px;
  font-weight:600;cursor:pointer;font-size:.9rem;transition:.15s}
nav.tabs button.active{background:var(--pink-500);color:#fff}
nav.tabs button:hover{background:var(--pink-300);color:#fff}
main{max-width:960px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px;
  box-shadow:0 4px 14px rgba(247,103,163,.08)}
.hero{background:linear-gradient(135deg,var(--pink-300),var(--pink-500));color:#fff;border-radius:22px;
  padding:34px 24px;text-align:center;margin-bottom:20px}
.hero h1{color:#fff;font-size:2rem;margin-bottom:6px}
.hero p{opacity:.95;margin:0 0 14px}
.btn{display:inline-block;border:none;background:var(--pink-500);color:#fff;padding:10px 18px;border-radius:999px;
  font-weight:700;cursor:pointer;font-size:.92rem}
.btn.secondary{background:#fff;color:var(--pink-600);border:2px solid #fff}
.btn.ghost{background:transparent;color:var(--pink-600);border:2px solid var(--pink-300)}
.btn.small{padding:6px 12px;font-size:.8rem}
.btn.danger{background:var(--bad)}
.grid{display:grid;gap:14px}
.grid.cats{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.cat{border:2px solid var(--line);border-radius:16px;padding:14px;text-align:center;cursor:pointer;background:#fff}
.cat.sel{border-color:var(--pink-500);background:var(--pink-50)}
.cat .ic{font-size:2.4rem}
.chiprow{display:flex;gap:8px;overflow-x:auto;padding:6px 2px;flex-wrap:wrap}
.chip{flex:0 0 auto;border:2px solid var(--line);border-radius:14px;padding:8px 14px;cursor:pointer;background:#fff;font-weight:600;white-space:nowrap}
.chip.sel{background:var(--pink-500);color:#fff;border-color:var(--pink-500)}
label.opt{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px dashed var(--line)}
input[type=number],input[type=text],input[type=tel],input[type=password],input[type=file],select,textarea{
  border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:.95rem;width:100%;background:#fff;color:var(--ink);margin-bottom:6px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.price{font-size:1.7rem;font-weight:800;color:var(--pink-600)}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:700}
.badge.paid{background:#c8f0c2;color:#3a7d3a}
.badge.unpaid{background:#ffd6d6;color:#b23a3a}
table{width:100%;border-collapse:collapse;font-size:.88rem}
table th,table td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
.subtabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.subtabs button{border:1px solid var(--pink-300);background:#fff;color:var(--pink-600);padding:6px 12px;border-radius:10px;cursor:pointer;font-weight:600}
.subtabs button.active{background:var(--pink-500);color:#fff}
.status-steps{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.step{flex:1;min-width:80px;text-align:center;padding:8px 4px;border-radius:10px;background:var(--pink-100);color:var(--ink-soft);font-size:.75rem;font-weight:700}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-grid .dow{font-weight:700;color:var(--ink-soft);font-size:.78rem;padding:4px 0}
.cal-day{border:1px solid var(--line);border-radius:8px;min-height:52px;padding:4px;font-size:.78rem;position:relative;background:#fff}
.cal-day.has-event{background:var(--pink-200);border:2px solid var(--pink-500)}
.cal-day.has-event .num{color:var(--pink-600)}
.cal-day.empty{border:none;background:transparent}
.cal-day .num{font-weight:700}
.cal-day .evt{position:absolute;bottom:3px;left:3px;right:3px;background:var(--pink-500);color:#fff;border-radius:5px;font-size:.62rem;padding:1px 2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.small{font-size:.82rem;color:var(--ink-soft)}
.itemrow{display:grid;grid-template-columns:1fr 90px auto;gap:6px;margin-bottom:6px;align-items:center}
.tier-table{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.tier-cell{flex:1;min-width:72px;text-align:center;padding:8px 4px;border-radius:10px;background:var(--pink-100);font-size:.74rem}
.tier-cell.active{background:var(--pink-500);color:#fff;font-weight:700}
.tier-cell .tq{opacity:.85}
.tier-cell .tp{font-weight:700;font-size:.88rem}
.deco-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.deco-item img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;display:block;border:1px solid var(--line)}
.evt-thumb{width:40px;height:40px;object-fit:cover;border-radius:8px;flex:0 0 auto}
.yearbar,.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;border:none;cursor:pointer;font-family:inherit;text-align:left}
.yearbar{background:linear-gradient(135deg,var(--pink-400),var(--pink-500));color:#fff;border-radius:16px;padding:12px 16px;font-size:1.15rem;font-weight:800;margin-top:20px}
.monthbar{background:var(--pink-100);color:var(--pink-600);border:1px solid var(--pink-300);border-radius:12px;padding:9px 14px;font-size:1rem;font-weight:700;margin-top:10px}
.yearbar .meta,.monthbar .meta{font-size:.8rem;font-weight:600;opacity:.9}
.yearbody{padding-left:10px;border-left:3px solid var(--pink-200);margin:8px 0 0 6px}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px;margin:10px 0}
.sumtile{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:center}
.sumtile .sl{font-size:.75rem;color:var(--ink-soft)}
.sumtile .sv{font-size:1.05rem;font-weight:800;color:var(--pink-600)}
.sumtile.profit .sv{color:#3a7d3a}
.sumtile.profit.neg .sv{color:var(--bad)}
.modal-back{position:fixed;inset:0;background:rgba(90,59,73,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal-box{background:var(--white);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:20px;max-width:340px;width:100%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.modal-box p{margin:0 0 16px;font-weight:600;line-height:1.5}
.footerbar{text-align:center;color:var(--ink-soft);font-size:.8rem;padding:20px}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--pink-50:#241820;--white:#2b1e26;--ink:#ffe4f0;--ink-soft:#c99cb0;--line:#4a2f3c}
  body{background:linear-gradient(180deg,#1c1218,#241820)}
  header.topbar{background:rgba(30,20,26,.9)}
  .cat,.chip,input,select,textarea{background:#33232c;color:var(--ink);border-color:var(--line)}
  .cal-day{background:#33232c}
}
:root[data-theme="dark"]{--pink-50:#241820;--white:#2b1e26;--ink:#ffe4f0;--ink-soft:#c99cb0;--line:#4a2f3c}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand" id="brandBox">🖨️ Printcezz <span class="dot">•</span></div>
  <nav class="tabs" id="navtabs"></nav>
</header>
<main id="app"></main>
<div class="footerbar">Printcezz 🩷</div>
<script>
const STORE_KEY='printcezz_data_v3';
const STATUS_LIST=['ยังไม่ถึงคิว','ทำไฟล์','เทสสี','ปริ้นท์รอตัด','รอจัดส่ง','ส่งแล้ว','เคลม'];
const ACTIVE_STATUS=['ยังไม่ถึงคิว','ทำไฟล์','เทสสี','ปริ้นท์รอตัด'];
const COMPLETED_STATUS=['ส่งแล้ว'];
const STATUS_COLORS={
  'ยังไม่ถึงคิว':{bg:'#ffd6d6',text:'#b23a3a'},
  'ทำไฟล์':{bg:'#ffdcb8',text:'#a1591a'},
  'เทสสี':{bg:'#fff3ad',text:'#8a7712'},
  'ปริ้นท์รอตัด':{bg:'#c8f0c2',text:'#3a7d3a'},
  'รอจัดส่ง':{bg:'#c2dcff',text:'#2c5fa8'},
  'ส่งแล้ว':{bg:'#c9c2f5',text:'#4b3a9e'},
  'เคลม':{bg:'#e8c2f5',text:'#7d3a9e'}
};
const SHIP_METHODS=[{id:'reg',label:'ลงทะเบียน',bg:'#ffd0e6',text:'#b23a6e'},{id:'ems',label:'EMS',bg:'#c2dcff',text:'#2c5fa8'},{id:'pickup',label:'นัดรับ/หน้างาน',bg:'#e0c2f5',text:'#7d3a9e'}];

function defaultData(){
  return {
    adminPass:'1234',
    nextOrderSeq:1,
    logo:'',
    home:{ title:'Printcezz 🩷', subtitle:'ร้านปริ้นท์ครบวงจร นามบัตร สติกเกอร์ โปสเตอร์ ป้ายไวนิล ใบปลิว และอีกมากมาย', images:[] },
    products:[
      {id:'biz',name:'นามบัตร',ic:'💼',icType:'emoji',icImage:'',variants:[
        {label:'กระดาษอาร์ตมัน 5.4x9 ซม.',tiers:{t1:3,t2:2.5,t3:2,t4:1.5},cost:1,images:[]},
        {label:'กระดาษการ์ดขาว 5.4x9 ซม.',tiers:{t1:3.5,t2:3,t3:2.5,t4:2},cost:1.2,images:[]}
      ],options:[{label:'เคลือบด้าน',price:0.3},{label:'เคลือบเงา',price:0.2},{label:'ปั๊มนูน',price:1.5}]},
      {id:'sticker',name:'สติกเกอร์ไดคัท',ic:'🏷️',icType:'emoji',icImage:'',variants:[
        {label:'สติกเกอร์กระดาษ 5x5 ซม.',tiers:{t1:5,t2:4,t3:3.5,t4:3},cost:1.5,images:[]},
        {label:'สติกเกอร์กันน้ำ 5x5 ซม.',tiers:{t1:6,t2:5,t3:4.5,t4:4},cost:2,images:[]}
      ],options:[{label:'เคลือบด้าน',price:0.5}]},
      {id:'poster',name:'โปสเตอร์',ic:'🖼️',icType:'emoji',icImage:'',variants:[
        {label:'กระดาษมันเงา A3',tiers:{t1:35,t2:30,t3:27,t4:24},cost:12,images:[]},
        {label:'กระดาษด้าน A3',tiers:{t1:35,t2:30,t3:27,t4:24},cost:12,images:[]}
      ],options:[]},
      {id:'vinyl',name:'ป้ายไวนิล',ic:'🏳️',icType:'emoji',icImage:'',variants:[
        {label:'ไวนิลมาตรฐาน (ราคา/ตร.ม.)',tiers:{t1:180,t2:160,t3:150,t4:140},cost:70,images:[]}
      ],options:[{label:'เจาะตาไก่',price:30},{label:'ทำขอบตะเข็บ',price:40}]},
      {id:'flyer',name:'ใบปลิว/เมนู',ic:'📄',icType:'emoji',icImage:'',variants:[
        {label:'กระดาษปอนด์ A5',tiers:{t1:6,t2:5,t3:4,t4:3},cost:1.8,images:[]},
        {label:'กระดาษอาร์ตมัน A5',tiers:{t1:7,t2:6,t3:5,t4:4},cost:2.2,images:[]}
      ],options:[{label:'เคลือบด้าน',price:0.5},{label:'พิมพ์ 2 หน้า',price:1.5}]}
    ],
    events:[],
    orders:[]
  };
}
let data = load();
function load(){ try{ const raw=localStorage.getItem(STORE_KEY); if(!raw) return defaultData(); const d=JSON.parse(raw); return {...defaultData(),...d}; }catch(e){ return defaultData(); } }
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(data)); }catch(e){ console.error('save failed',e); } }
function uid(){ return Math.random().toString(36).slice(2,9); }
function fmt(n){ return (n||0).toLocaleString('th-TH',{minimumFractionDigits:0,maximumFractionDigits:2}); }
function tierPrice(variant,qty){ if(!variant) return 0; if(qty<=10) return variant.tiers.t1; if(qty<=50) return variant.tiers.t2; if(qty<=100) return variant.tiers.t3; return variant.tiers.t4; }
function itemCalc(it){
  const p=data.products.find(x=>x.id===it.productId);
  const v=p ? p.variants[it.variantIdx] : null;
  const q=Math.max(1,parseInt(it.qty)||1);
  let unit = v ? tierPrice(v,q) : 0;
  if(p) p.options.forEach(op=>{ if((it.options||[]).includes(op.label)) unit+=op.price; });
  return {product:p, variant:v, qty:q, unit, total:unit*q};
}
function itemCost(it){
  const p=data.products.find(x=>x.id===it.productId);
  const v=p ? p.variants[it.variantIdx] : null;
  const q=Math.max(1,parseInt(it.qty)||1);
  return (v && v.cost ? v.cost : 0) * q;
}
function variantImages(v){ if(!v) return []; if(v.images && v.images.length) return v.images; if(v.image) return [v.image]; return []; }
function catIconHtml(p, size){
  if(p.icType==='image' && p.icImage) return `<img src="${p.icImage}" style="width:${size}px;height:${size}px;object-fit:cover;border-radius:50%">`;
  return `<span style="font-size:${Math.round(size*0.72)}px">${p.ic||'📦'}</span>`;
}
function catIconOption(p){ return p.icType==='image' ? '🖼️' : (p.ic||'📦'); }
function orderTotal(o){ return o.items.reduce((s,it)=>s+itemCalc(it).total,0) + (Number(o.shipping&&o.shipping.fee)||0); }
function orderCost(o){ return o.items.reduce((s,it)=>s+itemCost(it),0); }

let currentTab = 'home';
let isAdmin = sessionStorage.getItem('pz_admin')==='1';
let adminSub = 'orders';
let ordersView = 'active';
let orderSort = 'new';
let orderExcludedStatuses = new Set();
let collapsedOrders = new Set();
// หน้าต่างยืนยันในหน้าเว็บ (ใช้แทน confirm() ที่บางเบราว์เซอร์/แอปบล็อกไว้)
function askConfirm(msgHtml, onYes, yesLabel){
  const back=document.createElement('div'); back.className='modal-back';
  back.innerHTML=`<div class="modal-box" role="dialog" aria-modal="true"><p>${msgHtml}</p><div class="row" style="justify-content:center"><button class="btn ghost" data-a="no">ยกเลิก</button><button class="btn danger" data-a="yes">${yesLabel||'ลบ'}</button></div></div>`;
  const onKey=(e)=>{ if(e.key==='Escape') close(); };
  const close=()=>{ document.removeEventListener('keydown',onKey); back.remove(); };
  back.onclick=(e)=>{
    if(e.target===back){ close(); return; }
    const a=e.target.dataset&&e.target.dataset.a;
    if(a==='no') close();
    else if(a==='yes'){ close(); onYes(); }
  };
  document.addEventListener('keydown',onKey);
  document.body.appendChild(back);
  const noBtn=back.querySelector('[data-a="no"]'); if(noBtn) noBtn.focus();
}
let orderSearchQ = '';
function escAttr(t){ return String(t).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function orderSearchBarHtml(){
  return `<div class="row" style="margin-bottom:12px">
    <input type="text" id="adminOrderSearch" data-fid="admin-order-search" placeholder="🔍 ค้นหาตามรหัสคำสั่งซื้อหรือชื่อลูกค้า" value="${escAttr(orderSearchQ)}" style="flex:1;min-width:200px;margin-bottom:0">
    ${orderSearchQ?'<button class="btn small ghost" id="clearOrderSearch">ล้างการค้นหา</button>':''}
  </div>`;
}
let closedYears = new Set();   // ปี: เปิดอยู่เป็นค่าเริ่มต้น กดเพื่อย่อ
let openMonths = new Set();    // เดือน: ย่ออยู่เป็นค่าเริ่มต้น กดเพื่อเปิด
const TH_MONTHS=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
function sumOrders(list){
  const rev=list.reduce((s,o)=>s+orderTotal(o),0), cost=list.reduce((s,o)=>s+orderCost(o),0);
  return {count:list.length,rev,cost,profit:rev-cost};
}
function summaryHtml(list){
  const t=sumOrders(list);
  return `<div class="sumgrid">
    <div class="sumtile"><div class="sl">ออเดอร์</div><div class="sv">${t.count}</div></div>
    <div class="sumtile"><div class="sl">รายได้</div><div class="sv">${fmt(t.rev)}฿</div></div>
    <div class="sumtile"><div class="sl">ต้นทุน</div><div class="sv">${fmt(t.cost)}฿</div></div>
    <div class="sumtile profit ${t.profit<0?'neg':''}"><div class="sl">กำไร</div><div class="sv">${fmt(t.profit)}฿</div></div>
  </div>`;
}
const ACTIVE_FILTER_STATUSES = ['ยังไม่ถึงคิว','ทำไฟล์','เทสสี','ปริ้นท์รอตัด','เคลม'];
function randomOrderNo(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s='PZ';
  for(let i=0;i<6;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function sortOrdersList(list){
  const arr=[...list];
  if(orderSort==='old') arr.sort((a,b)=>a.queueNo-b.queueNo);
  else if(orderSort==='priceHigh') arr.sort((a,b)=>orderTotal(b)-orderTotal(a));
  else if(orderSort==='priceLow') arr.sort((a,b)=>orderTotal(a)-orderTotal(b));
  else arr.sort((a,b)=>b.queueNo-a.queueNo);
  return arr;
}
let calcState = { productId: data.products[0]?.id, variantIdx:0, opts:new Set(), qty:1 };
let calMonth = new Date(); calMonth.setDate(1);

const TABS = [
  {id:'home',label:'หน้าแรก'},
  {id:'calendar',label:'ปฏิทิน'},
  {id:'calc',label:'คำนวณราคา'},
  {id:'status',label:'ตรวจคำสั่งซื้อ'},
];

function renderNav(){
  const tabs = isAdmin? [...TABS, {id:'admin',label:'แอดมิน'}] : TABS;
  document.getElementById('navtabs').innerHTML = tabs.map(t=>`<button data-tab="${t.id}" class="${currentTab===t.id?'active':''}">${t.label}</button>`).join('');
  document.querySelectorAll('#navtabs button').forEach(b=>b.onclick=()=>{ currentTab=b.dataset.tab; render(); });
}
function renderBrand(){
  const box=document.getElementById('brandBox'); if(!box) return;
  const logo = data.logo ? `<img src="${data.logo}" style="height:28px;width:28px;object-fit:cover;border-radius:8px">` : '🖨️';
  box.innerHTML = `${logo} Printcezz <span class="dot">•</span>`;
}

function tierTableHtml(variant, qty){
  if(!variant) return '';
  const tiers=[['1-10',variant.tiers.t1],['11-50',variant.tiers.t2],['51-100',variant.tiers.t3],['101+',variant.tiers.t4]];
  const activeIdx = qty<=10?0:qty<=50?1:qty<=100?2:3;
  return `<div class="tier-table">${tiers.map((t,i)=>`<div class="tier-cell ${i===activeIdx?'active':''}"><div class="tq">${t[0]} ชิ้น</div><div class="tp">${fmt(t[1])}฿</div></div>`).join('')}</div>`;
}

function calcPrice(){
  const p = data.products.find(x=>x.id===calcState.productId);
  if(!p || !p.variants.length) return {unit:0,total:0,product:p,variant:null,qty:Math.max(1,parseInt(calcState.qty)||1)};
  const variant = p.variants[calcState.variantIdx] || p.variants[0];
  const qty = Math.max(1, parseInt(calcState.qty)||1);
  let unit = tierPrice(variant, qty);
  p.options.forEach(o=>{ if(calcState.opts.has(o.label)) unit += o.price; });
  return {unit, total: unit*qty, product:p, variant, qty};
}

function buildBillSummary(o){

  if(o.customerName) lines.push(`ลูกค้า: ${o.customerName}`);
  if(o.contact) lines.push(`ติดต่อ: ${o.contact}`);
  if(o.address) lines.push(`ที่อยู่: ${o.address}`);
  lines.push('รายการ:');
  o.items.forEach(it=>{
    const c=itemCalc(it);
    let line=`- ${c.product?c.product.name:'-'} (${c.variant?c.variant.label:'-'}) x${c.qty}`;
    if(it.options&&it.options.length) line+=` [${it.options.join(', ')}]`;
    if(it.link) line+=` ลิงก์งาน: ${it.link}`;
    line+=` = ${fmt(c.total)}฿`;
    lines.push(line);
  });
  const itemsTotal=o.items.reduce((s,it)=>s+itemCalc(it).total,0);
  const shipM=SHIP_METHODS.find(m=>m.id===(o.shipping&&o.shipping.method));
  lines.push(`ค่าจัดส่ง (${shipM?shipM.label:'-'}): ${fmt((o.shipping&&o.shipping.fee)||0)}฿`);
  lines.push(`รวมทั้งสิ้น: ${fmt(itemsTotal+Number((o.shipping&&o.shipping.fee)||0))}฿`);
  lines.push(`สถานะการชำระเงิน: ${o.paymentStatus==='paid'?'ชำระแล้ว':'ยังไม่ชำระ'}`);
  return lines.join('\n');
}

      </div>
      <div class="row" style="flex-wrap:wrap">
        ${ACTIVE_FILTER_STATUSES.map(s=>`<label class="opt" style="border:none;padding:4px 8px"><input type="checkbox" class="statusFilterChk" value="${s}" ${orderExcludedStatuses.has(s)?'':'checked'}> ${s}</label>`).join('')}
      </div>
    </div>`;
  }
  const sorted = sortOrdersList(filtered);
  let bodyHtml='';
  if(ordersView==='done'){
    // จัดกลุ่ม ปี -> เดือน (ใช้วันที่ส่งเสร็จ)
    const tree={}; const noDate=[];
    sorted.forEach(o=>{
      if(!o.completedAt){ noDate.push(o); return; }
      const y=o.completedAt.slice(0,4), m=o.completedAt.slice(5,7);
      ((tree[y]=tree[y]||{})[m]=tree[y][m]||[]).push(o);
    });
    const years=Object.keys(tree).sort().reverse();
    years.forEach(y=>{
      const yKey='y'+y, yOpen=!closedYears.has(yKey);
      const yList=Object.values(tree[y]).flat();
      bodyHtml+=`<button class="yearbar toggleYear" data-ykey="${yKey}"><span>${yOpen?'▾':'▸'} ปี ${Number(y)+543}</span><span class="meta">${yList.length} ออเดอร์</span></button>`;
      if(!yOpen) return;
      bodyHtml+=`<div class="yearbody"><div class="card" style="background:var(--pink-50);margin:8px 0 0"><h3>สรุปรายได้ปี ${Number(y)+543}</h3>${summaryHtml(yList)}</div>`;
      Object.keys(tree[y]).sort().reverse().forEach(m=>{
        const mKey='m'+y+'-'+m, mOpen=openMonths.has(mKey), mList=tree[y][m];
        const mName=TH_MONTHS[parseInt(m,10)-1]||m;
        bodyHtml+=`<button class="monthbar toggleMonth" data-mkey="${mKey}"><span>${mOpen?'▾':'▸'} 📅 ${mName} ${Number(y)+543}</span><span class="meta">${mList.length} ออเดอร์</span></button>`;
        if(mOpen){
          bodyHtml+=`<div class="card" style="background:var(--pink-50);margin:8px 0"><h4>สรุปรายได้เดือน${mName}</h4>${summaryHtml(mList)}</div>${mList.map(o=>orderCardHtml(o)).join('')}`;
        }
      });
      bodyHtml+=`</div>`;
    });
    if(noDate.length){
      const nKey='mnodate', nOpen=openMonths.has(nKey);
      bodyHtml+=`<button class="monthbar toggleMonth" data-mkey="${nKey}"><span>${nOpen?'▾':'▸'} ไม่ระบุวันที่</span><span class="meta">${noDate.length} ออเดอร์</span></button>`;
      if(nOpen) bodyHtml+=`<div class="card" style="background:var(--pink-50);margin:8px 0"><h4>สรุปรายได้ (ไม่ระบุวันที่)</h4>${summaryHtml(noDate)}</div>${noDate.map(o=>orderCardHtml(o)).join('')}`;
    }
    if(!years.length && !noDate.length) bodyHtml+='<p class="small">ยังไม่มีคำสั่งซื้อที่เสร็จสมบูรณ์</p>';
  } else {
    bodyHtml = sorted.map(o=>orderCardHtml(o)).join('') || '<p class="small">ไม่มีคำสั่งซื้อในหมวดนี้</p>';
  }
  return `
    <div class="subtabs">
      <button class="ovbtn ${ordersView==='active'?'active':''}" data-ov="active">ดำเนินการอยู่</button>
      <button class="ovbtn ${ordersView==='waiting'?'active':''}" data-ov="waiting">รอจัดส่ง</button>
      <button class="ovbtn ${ordersView==='done'?'active':''}" data-ov="done">เสร็จแล้ว</button>
    </div>
    ${ordersView==='active'?'<button class="btn" id="newOrderBtn">+ สร้างคำสั่งซื้อใหม่</button>':''}
    ${filterHtml}
    <div style="margin-top:14px">${bodyHtml}</div>`;
}

function setOrderStatus(o, newStatus){
  o.status=newStatus;
  if(COMPLETED_STATUS.includes(newStatus)){ if(!o.completedAt) o.completedAt=new Date().toISOString().slice(0,10); }
  else { o.completedAt=null; }
}

function wireAdminSub(){
  if(adminSub==='orders'){
    const searchInp=document.getElementById('adminOrderSearch');
    if(searchInp) searchInp.oninput=(e)=>{ orderSearchQ=e.target.value; renderKeepFocus(); };
    const clearSearch=document.getElementById('clearOrderSearch');
    if(clearSearch) clearSearch.onclick=()=>{ orderSearchQ=''; render(); };
    document.querySelectorAll('.ovbtn').forEach(b=>b.onclick=()=>{ ordersView=b.dataset.ov; render(); });
    document.querySelectorAll('.toggleYear').forEach(b=>b.onclick=()=>{ const k=b.dataset.ykey; if(closedYears.has(k)) closedYears.delete(k); else closedYears.add(k); render(); });
    document.querySelectorAll('.toggleMonth').forEach(b=>b.onclick=()=>{ const k=b.dataset.mkey; if(openMonths.has(k)) openMonths.delete(k); else openMonths.add(k); render(); });
    const sortSel=document.getElementById('sortSel'); if(sortSel) sortSel.onchange=(e)=>{ orderSort=e.target.value; render(); };
    document.querySelectorAll('.statusFilterChk').forEach(chk=>chk.onchange=(e)=>{
      if(e.target.checked) orderExcludedStatuses.delete(e.target.value); else orderExcludedStatuses.add(e.target.value);
      render();
    });
    const nb=document.getElementById('newOrderBtn');
    if(nb) nb.onclick=()=>{
      const orderNo='PZ'+String(data.nextOrderSeq++).padStart(4,'0');
      const queueNo = data.orders.length? Math.max(...data.orders.map(o=>o.queueNo))+1 : 1;
      data.orders.push({id:uid(),orderNo,queueNo,customerName:'',contact:'',address:'',
        items:[{id:uid(),productId:data.products[0]?.id,variantIdx:0,options:[],qty:1,note:'',link:''}],
        status:STATUS_LIST[0],paymentStatus:'unpaid',shipping:{method:'reg',note:'',fee:0},
        billSummary:'',billAuto:true,completedAt:null});
      save(); render();
    };
    document.querySelectorAll('#adminBody [data-oid]').forEach(card=>{
      const oid=card.dataset.oid, o=data.orders.find(x=>x.id===oid); if(!o) return;
      const toggleBtn=card.querySelector('.toggleCollapse');
      if(toggleBtn) toggleBtn.onclick=()=>{ if(collapsedOrders.has(oid)) collapsedOrders.delete(oid); else collapsedOrders.add(oid); render(); };
      if(collapsedOrders.has(oid)) return;
      if(!o.shipping) o.shipping={method:'reg',note:'',fee:0};
      const randBtn=card.querySelector('.randOrderNo'); if(randBtn) randBtn.onclick=()=>{ card.querySelector('.f-orderno').value=randomOrderNo(); };
      card.querySelector('.addItem').onclick=()=>{ o.items.push({id:uid(),productId:data.products[0]?.id,variantIdx:0,options:[],qty:1,note:'',link:''}); save(); render(); };
      card.querySelectorAll('[data-item-idx]').forEach(itemEl=>{
        const idx=parseInt(itemEl.dataset.itemIdx), it=o.items[idx]; if(!it) return;
        itemEl.querySelector('.it-product').onchange=(e)=>{ it.productId=e.target.value; it.variantIdx=0; it.options=[]; save(); render(); };
        itemEl.querySelector('.it-variant').onchange=(e)=>{ it.variantIdx=parseInt(e.target.value); save(); render(); };
        const qtyEl=itemEl.querySelector('.it-qty');
        qtyEl.oninput=(e)=>{ it.qty=e.target.value; save(); renderKeepFocus(); };
        itemEl.querySelectorAll('.it-opt').forEach(chk=>chk.onchange=(e)=>{
          it.options=it.options||[];
          if(e.target.checked) it.options.push(e.target.value); else it.options=it.options.filter(x=>x!==e.target.value);
          save(); render();
        });
        itemEl.querySelector('.it-note').onchange=(e)=>{ it.note=e.target.value; save(); };
        itemEl.querySelector('.it-link').onchange=(e)=>{ it.link=e.target.value; save(); };
        itemEl.querySelector('.delItem').onclick=()=>{ o.items.splice(idx,1); save(); render(); };
      });
      card.querySelectorAll('.ship-chip').forEach(chip=>chip.onclick=()=>{ o.shipping.method=chip.dataset.ship; save(); render(); });
      const shipNote=card.querySelector('.ship-note'); if(shipNote) shipNote.onchange=(e)=>{ o.shipping.note=e.target.value; save(); };
      const shipFee=card.querySelector('.ship-fee'); if(shipFee) shipFee.oninput=(e)=>{ o.shipping.fee=e.target.value; save(); renderKeepFocus(); };
      const statusSel=card.querySelector('.f-status'); if(statusSel) statusSel.onchange=(e)=>{ setOrderStatus(o,e.target.value); save(); render(); };
      const paySel=card.querySelector('.f-pay'); if(paySel) paySel.onchange=(e)=>{ o.paymentStatus=e.target.value; save(); render(); };
      const billTa=card.querySelector('.bill-summary'); if(billTa) billTa.onchange=(e)=>{ o.billSummary=e.target.value; o.billAuto=false; save(); };
      const regenBtn=card.querySelector('.regenBill'); if(regenBtn) regenBtn.onclick=()=>{ o.billSummary=buildBillSummary(o); o.billAuto=true; save(); render(); };
      const copyBtn=card.querySelector('.copyBill'); if(copyBtn) copyBtn.onclick=()=>{
        const txt=o.billSummary||''; if(navigator.clipboard){ navigator.clipboard.writeText(txt).then(()=>alert('คัดลอกแล้ว')).catch(()=>alert('คัดลอกไม่สำเร็จ')); } else alert('เบราว์เซอร์นี้ไม่รองรับการคัดลอกอัตโนมัติ');
      };
      card.querySelector('.saveOrder').onclick=()=>{
        const newNo=card.querySelector('.f-orderno').value.trim();
        if(newNo && newNo.toUpperCase()!==o.orderNo.toUpperCase()){
          const dup=data.orders.some(x=>x.id!==o.id && x.orderNo.toUpperCase()===newNo.toUpperCase());
          if(dup){ alert('รหัสคำสั่งซื้อนี้ถูกใช้แล้ว กรุณาใช้รหัสอื่น'); return; }
          o.orderNo=newNo;
        }
        o.customerName=card.querySelector('.f-name').value;
        o.contact=card.querySelector('.f-contact').value;
        o.address=card.querySelector('.f-address').value;
        if(o.billAuto!==false){ o.billSummary=buildBillSummary(o); }
        save(); render(); alert('บันทึกแล้ว');
      };
      card.querySelector('.delOrder').onclick=()=>{
        askConfirm(`ลบคำสั่งซื้อ <b>#${escAttr(o.orderNo)}</b>${o.customerName?` ของ ${escAttr(o.customerName)}`:''} ใช่ไหม?<br><span class="small">ลบแล้วกู้คืนไม่ได้</span>`, ()=>{
          data.orders=data.orders.filter(x=>x.id!==oid); collapsedOrders.delete(oid); save(); render();
        });
      };
    });
  }
  if(adminSub==='calendar'){
    const nb=document.getElementById('newEventBtn');
    if(nb) nb.onclick=()=>{ data.events.push({id:uid(),date:new Date().toISOString().slice(0,10),title:'',note:'',image:''}); save(); render(); };
    document.querySelectorAll('#adminBody [data-eid]').forEach(row=>{
      const eid=row.dataset.eid, e=data.events.find(x=>x.id===eid); if(!e) return;
      const fileEl=row.querySelector('.e-file');
      if(fileEl) fileEl.onchange=(ev)=>{
        const f=ev.target.files[0]; if(!f) return;
        const reader=new FileReader();
        reader.onload=()=>{ e.image=reader.result; save(); render(); };
        reader.readAsDataURL(f);
      };
      row.querySelector('.saveEvent').onclick=()=>{ e.date=row.querySelector('.e-date').value; e.title=row.querySelector('.e-title').value; e.note=row.querySelector('.e-note').value; save(); render(); };
      row.querySelector('.delEvent').onclick=()=>{ data.events=data.events.filter(x=>x.id!==eid); save(); render(); };
    });
  }
  if(adminSub==='products'){
    const nb=document.getElementById('newProductBtn');
    if(nb) nb.onclick=()=>{ data.products.push({id:uid(),name:'สินค้าใหม่',ic:'🆕',icType:'emoji',icImage:'',variants:[{label:'ตัวเลือก 1',tiers:{t1:0,t2:0,t3:0,t4:0},cost:0,images:[]}],options:[]}); save(); render(); };
    document.querySelectorAll('#adminBody [data-pid]').forEach(card=>{
      const pid=card.dataset.pid, p=data.products.find(x=>x.id===pid); if(!p) return;
      card.querySelector('.addVariant').onclick=()=>{ p.variants.push({label:'',tiers:{t1:0,t2:0,t3:0,t4:0},cost:0,images:[]}); save(); render(); };
      card.querySelectorAll('.delVariant').forEach(b=>b.onclick=()=>{ const i=parseInt(b.closest('[data-vi]').dataset.vi); p.variants.splice(i,1); save(); render(); });
      card.querySelectorAll('.variants [data-vi]').forEach(row=>{
        const i=parseInt(row.dataset.vi);
        if(!p.variants[i].images) p.variants[i].images = p.variants[i].image? [p.variants[i].image] : [];
        const vf=row.querySelector('.v-file');
        if(vf) vf.onchange=(ev)=>{
          const files=Array.from(ev.target.files||[]); if(!files.length) return;
          let remaining=files.length;
          files.forEach(f=>{
            const reader=new FileReader();
            reader.onload=()=>{ p.variants[i].images.push(reader.result); remaining--; if(remaining===0){ save(); render(); } };
            reader.readAsDataURL(f);
          });
        };
        row.querySelectorAll('.delVImg').forEach(b=>b.onclick=()=>{ const ii=parseInt(b.dataset.ii); p.variants[i].images.splice(ii,1); save(); render(); });
      });
      card.querySelectorAll('[data-icmode]').forEach(b=>b.onclick=()=>{ p.icType=b.dataset.icmode; save(); render(); });
      const icFile=card.querySelector('.p-icfile');
      if(icFile) icFile.onchange=(ev)=>{
        const f=ev.target.files[0]; if(!f) return;
        const reader=new FileReader();
        reader.onload=()=>{ p.icImage=reader.result; save(); render(); };
        reader.readAsDataURL(f);
      };
      card.querySelector('.addOpt').onclick=()=>{ p.options.push({label:'',price:0}); save(); render(); };
      card.querySelectorAll('.delOpt').forEach(b=>b.onclick=()=>{ const i=parseInt(b.closest('.itemrow').dataset.i); p.options.splice(i,1); save(); render(); });
      card.querySelector('.saveProduct').onclick=()=>{
        const icInput=card.querySelector('.p-ic'); if(icInput) p.ic=icInput.value;
        p.name=card.querySelector('.p-name').value;
        card.querySelectorAll('.variants [data-vi]').forEach((row,i)=>{
          p.variants[i].label=row.querySelector('.v-label').value;
          p.variants[i].tiers={t1:parseFloat(row.querySelector('.v-t1').value)||0,t2:parseFloat(row.querySelector('.v-t2').value)||0,t3:parseFloat(row.querySelector('.v-t3').value)||0,t4:parseFloat(row.querySelector('.v-t4').value)||0};
          p.variants[i].cost=parseFloat(row.querySelector('.v-cost').value)||0;
        });
        card.querySelectorAll('.opts .itemrow').forEach((row,i)=>{ p.options[i].label=row.querySelector('.o-label').value; p.options[i].price=parseFloat(row.querySelector('.o-price').value)||0; });
        save(); render(); alert('บันทึกแล้ว');
      };
      card.querySelector('.delProduct').onclick=()=>{
        askConfirm(`ลบหมวดหมู่ <b>${escAttr(p.name)}</b> ใช่ไหม?<br><span class="small">ลบแล้วกู้คืนไม่ได้</span>`, ()=>{
          data.products=data.products.filter(x=>x.id!==pid); save(); render();
        });
      };
    });
  }
  if(adminSub==='home'){
    const saveLogoBtn=document.getElementById('saveLogoBtn');
    if(saveLogoBtn) saveLogoBtn.onclick=()=>{
      const f=document.getElementById('logo-file').files[0];
      if(!f){ alert('เลือกไฟล์รูปก่อน'); return; }
      const reader=new FileReader();
      reader.onload=()=>{ data.logo=reader.result; save(); render(); };
      reader.readAsDataURL(f);
    };
    const delLogoBtn=document.getElementById('delLogoBtn');
    if(delLogoBtn) delLogoBtn.onclick=()=>{ data.logo=''; save(); render(); };
    document.getElementById('saveHomeText').onclick=()=>{ data.home.title=document.getElementById('h-title').value; data.home.subtitle=document.getElementById('h-sub').value; save(); alert('บันทึกแล้ว'); };
    document.getElementById('addImgBtn').onclick=()=>{
      const f=document.getElementById('h-file').files[0];
      const cap=document.getElementById('h-caption').value;
      if(!f){ alert('เลือกไฟล์รูปก่อน'); return; }
      const reader=new FileReader();
      reader.onload=()=>{ data.home.images.push({id:uid(),url:reader.result,caption:cap}); save(); render(); };
      reader.readAsDataURL(f);
    };
    document.querySelectorAll('#adminBody .delImg').forEach(b=>b.onclick=()=>{ const iid=b.closest('[data-iid]').dataset.iid; data.home.images=data.home.images.filter(x=>x.id!==iid); save(); render(); });
  }
  if(adminSub==='settings'){
    document.getElementById('savePassBtn').onclick=()=>{
      const v=document.getElementById('newPass').value; if(v){ data.adminPass=v; save(); alert('เปลี่ยนรหัสผ่านแล้ว'); }
    };
    document.getElementById('exportBtn').onclick=()=>{
      const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='printcezz-data.json'; a.click();
    };
  }
}

function render(){
  renderNav();
  renderBrand();
  const app=document.getElementById('app');
  if(currentTab==='home') app.innerHTML=renderHome();
  else if(currentTab==='calendar') app.innerHTML=renderCalendarPage();
  else if(currentTab==='calc') app.innerHTML=renderCalculator();
  else if(currentTab==='status') app.innerHTML=renderStatusPage();
  else if(currentTab==='admin') app.innerHTML=renderAdmin();

  if(currentTab==='home') wireHome();
  if(currentTab==='calc') wireCalculator();
  if(currentTab==='calendar') wireCalendar();
  if(currentTab==='status') wireStatus();
  if(currentTab==='admin'){ if(!isAdmin) wireAdminLogin(); else wireAdminShell(); }
}
function renderKeepFocus(){
  const ae=document.activeElement;
  const fid = ae && ae.dataset ? ae.dataset.fid : null;
  const selStart = ae && typeof ae.selectionStart==='number' ? ae.selectionStart : null;
  const selEnd = ae && typeof ae.selectionEnd==='number' ? ae.selectionEnd : null;
  render();
  if(fid){
    const el=document.querySelector(`[data-fid="${fid}"]`);
    if(el){ el.focus(); if(selStart!=null){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} } }
  }
}
render();
</script>
</body>
